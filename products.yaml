# Optional: pin an ingredient to a specific Whole Foods product so the cart
# gets the same thing every week. `search` overrides the search phrase;
# `asin` (the 10-char code in an Amazon product URL) adds that exact product.
# `category` groups the shopping list by store section. `cart_qty` overrides
# how many go in the cart (e.g. a recipe needs 12 tortillas but they come 30/pack).
boneless skinless chicken thighs:
  search: whole foods boneless skinless chicken thighs
  category: Meat & Seafood
salmon fillet:
  search: whole foods atlantic salmon fillet
  category: Meat & Seafood
corn tortillas: {category: Bakery, cart_qty: 1}  # 12 tortillas = one pack
oat milk: {search: oatly oat milk, category: Dairy & Eggs}
hummus: {category: Deli}
