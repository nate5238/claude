name: Bangers With Mashed Winter Squash and Fried Sage
servings: 4
tags: [dinner, sheet-pan]
ingredients:
  - {item: butternut squash, qty: 1, unit: count}  # medium, about 2 lb
  - {item: olive oil, qty: 3, unit: tbsp}
  - {item: kosher salt, qty: 0.75, unit: tsp}
  - {item: black pepper, qty: 0.25, unit: tsp}
  - {item: italian sausages, qty: 1, unit: lb}  # sweet or spicy
  - {item: half-and-half, qty: 0.25, unit: cup}  # or whole milk
  - {item: maple syrup, qty: 1, unit: tsp}
  - {item: cayenne, qty: 1, unit: pinch}
  - {item: unsalted butter, qty: 4, unit: tbsp}
  - {item: sage, qty: 1, unit: bunch}  # 1/3 cup leaves
  - {item: garlic, qty: 1, unit: clove}
notes: NYT Cooking, Lidey Heuck. 50 minutes. Roast squash and sausages at 450°F for 30 min; mash squash with half-and-half, maple and cayenne; brown butter with sage and garlic to drizzle.
